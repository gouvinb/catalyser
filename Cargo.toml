[workspace]
resolver = "3"
members = [
    "catalyser",
    "catalyser-derive"
]

[patch.crates-io]
catalyser = { path = "catalyser" }

[workspace.package]
authors = ["gouvinb"]
edition = "2024"
categories = ["rust-patterns"]
license-file = "LICENSE.md"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/gouvinb/catalyser"

[workspace.dependencies]
catalyser-derive = { path = "catalyser-derive" }

pollster = "1.0.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = "1.0.229"
serde_json = "1.0.151"
syn = "3.0.6"
trybuild = "1.0.121"
