[workspace]
resolver = "2"
members = [
    "catalyser",
    "catalyser-derive"
]

[patch.crates-io]
catalyser = { path = "catalyser" }

[workspace.package]
authors = ["gouvinb"]
edition = "2024"
categories = ["rust-patterns"]
license-file = "LICENSE.md"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/gouvinb/catalyser"

[dependencies]
serde = { version = "1.0.229" }

[dev-dependencies]
serde_json = { version = "1.0.151" }
